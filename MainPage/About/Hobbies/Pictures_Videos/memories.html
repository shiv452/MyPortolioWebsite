<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Glimpse of Memories</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/MainPage/About/Hobbies/Pictures_Videos/memories.css">
    <!-- Firebase Auth: reuses the admin session signed into from the main
         site's footer lock icon (Firebase Auth persists across pages on
         the same origin). Toggles body.is-admin, which memories.css uses
         to hide the add/remove controls for regular visitors. -->
    <script type="module" src="/JavaScript/auth.js"></script>
</head>

<body>

    <canvas id="starCanvas"></canvas>

    <header class="hdr">
        <a href="/index.html#about" class="back-btn">&#8592; Back</a>
        <div class="hdr-mid">
            <h1>&#128248; My Glimpse</h1>
            <p>Hover to reveal <span class="dot-sep">&middot;</span> Click to pin <span class="dot-sep">&middot;</span> &#10005; to remove <span class="dot-sep">&middot;</span> + to add</p>
        </div>

        <div class="hdr-right">
            <div class="photo-count" id="photoCount">0 photos</div>
            <button class="add-btn" title="Add Photos"
                onclick="document.getElementById('photoInput').click()">+</button>
            <input type="file" id="photoInput" multiple accept="image/*" style="display: none;">
        </div>
    </header>

    <div class="mem-toast" id="memToast"></div>

    <div class="speed-dock" id="speedDock">
        <div class="speed-dock-handle">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M13 2 3 14h7l-1 8 10-12h-7l1-8z" />
            </svg>
        </div>
        <div class="speed-dock-panel">
            <div class="speed-dock-top">
                <span class="speed-dock-label">Float Speed</span>
                <span class="speed-dock-value" id="speedValue">1.0&times;</span>
            </div>
            <input type="range" id="speedSlider" class="speed-slider" min="0" max="200" value="100" step="5">
            <div class="speed-dock-scale">
                <span>0&times;</span>
                <span>1&times;</span>
                <span>2&times;</span>
            </div>
        </div>
    </div>

    <script>
        (function () {
            var SRCS = [
                '/Images/memories/1.jpg',
                '/Images/memories/2.jpg',
                '/Images/memories/4.jpg',
                '/Images/memories/5.jpg',
                '/Images/memories/6.jpg',
                '/Images/memories/7.jpg',
                '/Images/memories/8.jpg',
                '/Images/memories/9.jpg',
                '/Images/memories/11.jpg',
                '/Images/memories/12.jpg',
                '/Images/memories/13.jpg',
                '/Images/memories/14.jpg',
                '/Images/memories/15.jpg',
                '/Images/memories/16.jpg',
                '/Images/memories/17.jpg',
                '/Images/memories/18.jpg',
                '/Images/memories/19.jpg',
                '/Images/memories/20.jpg',
                '/Images/memories/21.jpg',
                '/Images/memories/img17.jpg',
                '/Images/memories/img24.webp',
                '/Images/memories/img25.webp',
                '/Images/memories/pic1.jpg',
                '/Images/memories/pic2.jpg',
                '/Images/memories/pic3.jpg',
                '/Images/memories/pic4.jpg',
                '/Images/memories/pic5.jpg',
                '/Images/memories/pic6.jpg',
                '/Images/memories/pic7.jpg',
                '/Images/memories/pic8.jpg',
                '/Images/memories/pic9.jpg',
                '/Images/memories/pic10.jpg',
                '/Images/memories/pic11.jpg'
            ];

            var EXPAND_W = 280; // expanded card width
            var EXPAND_H = 360; // expanded card height (portrait, avoids cropping faces)
            var EXPAND = EXPAND_W; // kept for proximity-threshold math below
            var HEADER_H = 64; // height of header to prevent photo from going under it when spawned.
            var GLOWS = [
                { c: '#6366f1', s: '0 0 4px 1px #fff, 0 0 14px 5px #6366f1, 0 0 28px 12px rgba(99,102,241,0.7), 0 0 48px 20px rgba(99,102,241,0.4), 0 0 76px 30px rgba(99,102,241,0.18)' },
                { c: '#22d3ee', s: '0 0 4px 1px #fff, 0 0 14px 5px #22d3ee, 0 0 28px 12px rgba(34,211,238,0.7), 0 0 48px 20px rgba(34,211,238,0.4), 0 0 76px 30px rgba(34,211,238,0.18)' },
                { c: '#a78bfa', s: '0 0 4px 1px #fff, 0 0 14px 5px #a78bfa, 0 0 28px 12px rgba(167,139,250,0.7), 0 0 48px 20px rgba(167,139,250,0.4), 0 0 76px 30px rgba(167,139,250,0.18)' },
                { c: '#f472b6', s: '0 0 4px 1px #fff, 0 0 14px 5px #f472b6, 0 0 28px 12px rgba(244,114,182,0.7), 0 0 48px 20px rgba(244,114,182,0.4), 0 0 76px 30px rgba(244,114,182,0.18)' },
                { c: '#fbbf24', s: '0 0 4px 1px #fff, 0 0 14px 5px #fbbf24, 0 0 28px 12px rgba(251,191,36,0.7), 0 0 48px 20px rgba(251,191,36,0.4), 0 0 76px 30px rgba(251,191,36,0.18)' },
                { c: '#34d399', s: '0 0 4px 1px #fff, 0 0 14px 5px #34d399, 0 0 28px 12px rgba(52,211,153,0.7), 0 0 48px 20px rgba(52,211,153,0.4), 0 0 76px 30px rgba(52,211,153,0.18)' },
                { c: '#fb7185', s: '0 0 4px 1px #fff, 0 0 14px 5px #fb7185, 0 0 28px 12px rgba(251,113,133,0.7), 0 0 48px 20px rgba(251,113,133,0.4), 0 0 76px 30px rgba(251,113,133,0.18)' },
                { c: '#06b6d4', s: '0 0 4px 1px #fff, 0 0 14px 5px #06b6d4, 0 0 28px 12px rgba(6,182,212,0.7), 0 0 48px 20px rgba(6,182,212,0.4), 0 0 76px 30px rgba(6,182,212,0.18)' },
                { c: '#ec4899', s: '0 0 4px 1px #fff, 0 0 14px 5px #ec4899, 0 0 28px 12px rgba(236,72,153,0.7), 0 0 48px 20px rgba(236,72,153,0.4), 0 0 76px 30px rgba(236,72,153,0.18)' },
                { c: '#8b5cf6', s: '0 0 4px 1px #fff, 0 0 14px 5px #8b5cf6, 0 0 28px 12px rgba(139,92,246,0.7), 0 0 48px 20px rgba(139,92,246,0.4), 0 0 76px 30px rgba(139,92,246,0.18)' },
                { c: '#14b8a6', s: '0 0 4px 1px #fff, 0 0 14px 5px #14b8a6, 0 0 28px 12px rgba(20,184,166,0.7), 0 0 48px 20px rgba(20,184,166,0.4), 0 0 76px 30px rgba(20,184,166,0.18)' },
                { c: '#f97316', s: '0 0 4px 1px #fff, 0 0 14px 5px #f97316, 0 0 28px 12px rgba(249,115,22,0.7), 0 0 48px 20px rgba(249,115,22,0.4), 0 0 76px 30px rgba(249,115,22,0.18)' }
            ];

            var W = window.innerWidth, H = window.innerHeight;
            var mx = -9999, my = -9999;
            var bubbles = [];
            var speedMul = 1; // global float-speed multiplier, controlled by the speed dock slider

            /* Removals are session only for now - Firebase will make them permanent */

            window.addEventListener('resize', function () { W = window.innerWidth; H = window.innerHeight; })

            function rand(a, b) { return a + Math.random() * (b - a); }

            /* ========= Galaxy Canvas ========== */
            (function () {
                var c = document.getElementById('starCanvas');
                var ctx = c.getContext('2d');
                var stars = [], shoots = [], shootTimer = 0, nextShoot = 70;
                function resize() { c.width = window.innerWidth; c.height = window.innerHeight; }
                window.addEventListener('resize', resize); resize();

                /* Galaxy core anchor point - off-center so it reads as looking across
                   a galaxy disc rather than dead-center at a logo-like spiral. */
                var coreX = 0.66, coreY = 0.30;

                /* ---- Spiral-arm star field ----
                   Two logarithmic arms wind out from the core with random scatter so they
                   read as fuzzy bands of stars, not drawn lines. Density + brightness fall
                   off with distance from the core, which is what actually sells "galaxy". */
                var ARMS = 2;
                var ARM_STARS = 280;
                var BG_STARS = 150;
                var starTints = ['255,255,255', '199,210,254', '165,243,252', '253,224,196', '216,180,254'];

                function pickTint(nearCore) {
                    if (Math.random() > 0.45) return '255,255,255';
                    return nearCore
                        ? starTints[Math.random() < 0.55 ? 3 : 0]
                        : starTints[Math.floor(Math.random() * starTints.length)];
                }

                for (var arm = 0; arm < ARMS; arm++) {
                    var armOffset = (arm / ARMS) * Math.PI * 2;
                    for (var i = 0; i < ARM_STARS; i++) {
                        var t = Math.pow(Math.random(), 0.65);
                        var angle = armOffset + t * Math.PI * 2.6;
                        var radius = t * 0.62;
                        var scatter = rand(-1, 1) * (0.025 + t * 0.05);
                        var sx = coreX + Math.cos(angle) * radius + Math.cos(angle + Math.PI / 2) * scatter;
                        var sy = coreY + Math.sin(angle) * radius * 0.55 + Math.sin(angle + Math.PI / 2) * scatter * 0.55;

                        var nearCore = t < 0.35;
                        var baseAlpha = (1 - t * 0.7) * rand(0.35, 0.95);
                        stars.push({
                            x: sx, y: sy,
                            r: nearCore ? rand(0.6, 1.9) : rand(0.3, 1.15),
                            a: baseAlpha, baseA: baseAlpha,
                            sp: rand(0.00012, 0.00028), // slow, gentle twinkle only - no large swings
                            d: Math.random() > 0.5 ? 1 : -1,
                            tint: pickTint(nearCore)
                        });
                    }
                }
                for (var i = 0; i < BG_STARS; i++) {
                    stars.push({
                        x: Math.random(), y: Math.random(),
                        r: rand(0.2, 0.7), a: rand(0.1, 0.5), baseA: rand(0.1, 0.5),
                        sp: rand(0.00008, 0.0002), d: Math.random() > 0.5 ? 1 : -1,
                        tint: '255,255,255'
                    });
                }

                /* A handful of stars get a real diffraction-spike sparkle (the plus-shaped
                   flare seen on the brightest stars in real astrophotography). */
                var flareStars = [];
                for (var i = 0; i < 6; i++) {
                    var src = stars[Math.floor(rand(0, ARM_STARS * ARMS * 0.3))];
                    if (src) { src.r = Math.max(src.r, rand(1.6, 2.2)); src.a = Math.max(src.a, 0.85); flareStars.push(src); }
                }

                /* Cosmic dust specks - barely-visible, extremely slow drift, pure atmosphere */
                var dust = [];
                for (var i = 0; i < 70; i++) {
                    dust.push({
                        x: Math.random(), y: Math.random(),
                        r: rand(0.4, 1.1), a: rand(0.025, 0.08),
                        dx: rand(-0.000012, 0.000012), dy: rand(0.000004, 0.000016)
                    });
                }

                /* ---- Nebula clouds ----
                   Each "cloud" is built from 3-4 overlapping offset blobs instead of one
                   perfect circle - this breaks up the telltale flat-gradient look and
                   reads as a wispy, organic gas cloud instead. Drift is glacially slow
                   and purely time-based (no input reactivity at all). */
                function makeCloud(cx, cy, r, color, alpha) {
                    var blobs = [];
                    var n = 3 + Math.floor(Math.random() * 2);
                    for (var i = 0; i < n; i++) {
                        blobs.push({
                            ox: rand(-0.35, 0.35) * r, oy: rand(-0.3, 0.3) * r,
                            r: r * rand(0.55, 1), a: alpha * rand(0.55, 1)
                        });
                    }
                    return { x: cx, y: cy, color: color, blobs: blobs, t: rand(0, 6) };
                }
                var nebulae = [
                    Object.assign(makeCloud(coreX, coreY, 0.30, '253,224,196', 0.15), { dx: 0, dy: 0 }),
                    Object.assign(makeCloud(0.20, 0.28, 0.40, '99,102,241', 0.10), { dx: 0.0000035, dy: 0.0000018 }),
                    Object.assign(makeCloud(0.80, 0.62, 0.44, '34,211,238', 0.085), { dx: -0.0000028, dy: 0.0000022 }),
                    Object.assign(makeCloud(0.46, 0.86, 0.36, '167,139,250', 0.095), { dx: 0.0000020, dy: -0.0000030 }),
                    Object.assign(makeCloud(0.08, 0.80, 0.32, '244,114,182', 0.065), { dx: 0.0000030, dy: -0.0000012 }),
                    Object.assign(makeCloud(0.92, 0.14, 0.34, '52,211,153', 0.075), { dx: -0.0000022, dy: 0.0000026 }),
                    Object.assign(makeCloud(0.60, 0.94, 0.30, '236,72,153', 0.06), { dx: -0.0000016, dy: -0.0000020 })
                ];

                /* Dust lanes - dark wisps crossing the bright core/arms for photographic contrast */
                var dustLanes = [
                    { x: coreX - 0.10, y: coreY + 0.06, len: 0.46, w: 0.085, ang: 0.55, a: 0.22 },
                    { x: coreX + 0.05, y: coreY - 0.10, len: 0.38, w: 0.07, ang: -0.95, a: 0.16 },
                    { x: coreX - 0.22, y: coreY - 0.14, len: 0.30, w: 0.06, ang: 2.3, a: 0.14 }
                ];

                function spawnShoot() {
                    var ang = rand(30, 55) * Math.PI / 180, spd = rand(9, 16);
                    shoots.push({ x: rand(-0.1, 1.1) * c.width, y: -15, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd, len: rand(80, 160), w: rand(1.2, 2.2), life: 1, decay: rand(0.015, 0.028) });
                }

                function drawFlare(x, y, r, alpha) {
                    /* diffraction-spike sparkle: a soft round core + 4 thin crossed rays */
                    var grad = ctx.createRadialGradient(x, y, 0, x, y, r * 5);
                    grad.addColorStop(0, 'rgba(255,255,255,' + alpha + ')');
                    grad.addColorStop(1, 'transparent');
                    ctx.fillStyle = grad;
                    ctx.beginPath(); ctx.arc(x, y, r * 5, 0, Math.PI * 2); ctx.fill();

                    ctx.save();
                    ctx.translate(x, y);
                    ctx.strokeStyle = 'rgba(255,255,255,' + (alpha * 0.5) + ')';
                    ctx.lineWidth = 0.6;
                    [0, Math.PI / 2].forEach(function (rot) {
                        ctx.beginPath();
                        ctx.moveTo(-r * 9 * Math.cos(rot), -r * 9 * Math.sin(rot));
                        ctx.lineTo(r * 9 * Math.cos(rot), r * 9 * Math.sin(rot));
                        ctx.stroke();
                    });
                    ctx.restore();
                }

                function draw() {
                    ctx.clearRect(0, 0, c.width, c.height);

                    /* Base radial vignette, anchored to the galaxy core */
                    var g = ctx.createRadialGradient(c.width * coreX, c.height * coreY, 0, c.width * coreX, c.height * coreY, c.width * .68);
                    g.addColorStop(0, 'rgba(180,150,255,0.07)');
                    g.addColorStop(1, 'transparent');
                    ctx.fillStyle = g; ctx.fillRect(0, 0, c.width, c.height);

                    /* Nebula clouds - layered blobs, ultra-slow ambient drift only */
                    nebulae.forEach(function (n) {
                        n.x += n.dx; n.y += n.dy; n.t += 0.0012;
                        if (n.x < -0.25) n.x = 1.25; if (n.x > 1.25) n.x = -0.25;
                        if (n.y < -0.25) n.y = 1.25; if (n.y > 1.25) n.y = -0.25;
                        var breathe = 0.85 + 0.15 * Math.sin(n.t);
                        n.blobs.forEach(function (b) {
                            var bx = n.x * c.width + b.ox * Math.max(c.width, c.height);
                            var by = n.y * c.height + b.oy * Math.max(c.width, c.height);
                            var br = b.r * Math.max(c.width, c.height);
                            var ng = ctx.createRadialGradient(bx, by, 0, bx, by, br);
                            ng.addColorStop(0, 'rgba(' + n.color + ',' + (b.a * breathe) + ')');
                            ng.addColorStop(1, 'transparent');
                            ctx.fillStyle = ng;
                            ctx.fillRect(0, 0, c.width, c.height);
                        });
                    });

                    /* Cosmic dust - near-invisible specks, slow drift, pure atmosphere */
                    dust.forEach(function (d) {
                        d.x += d.dx; d.y += d.dy;
                        if (d.x < -0.05) d.x = 1.05; if (d.x > 1.05) d.x = -0.05;
                        if (d.y > 1.05) d.y = -0.05;
                        ctx.beginPath();
                        ctx.arc(d.x * c.width, d.y * c.height, d.r, 0, Math.PI * 2);
                        ctx.fillStyle = 'rgba(255,255,255,' + d.a + ')';
                        ctx.fill();
                    });

                    /* Spiral-arm + background stars - gentle twinkle only, no positional motion */
                    stars.forEach(function (s) {
                        s.a += s.sp * s.d;
                        if (s.a > s.baseA * 1.25 || s.a < s.baseA * 0.7) s.d *= -1;
                        ctx.beginPath(); ctx.arc(s.x * c.width, s.y * c.height, s.r, 0, Math.PI * 2);
                        ctx.fillStyle = 'rgba(' + s.tint + ',' + Math.max(0, s.a) + ')'; ctx.fill();
                    });

                    /* Diffraction-spike flares on the brightest few stars */
                    flareStars.forEach(function (s) {
                        drawFlare(s.x * c.width, s.y * c.height, s.r, s.a * 0.5);
                    });

                    /* Dust lanes - dark streaks crossing the bright core/arms for contrast */
                    dustLanes.forEach(function (l) {
                        var cx = l.x * c.width, cy = l.y * c.height;
                        var dx = Math.cos(l.ang) * l.len * c.width, dy = Math.sin(l.ang) * l.len * c.height;
                        var lg = ctx.createLinearGradient(cx - dx / 2, cy - dy / 2, cx + dx / 2, cy + dy / 2);
                        lg.addColorStop(0, 'rgba(4,5,13,0)');
                        lg.addColorStop(0.5, 'rgba(4,5,13,' + l.a + ')');
                        lg.addColorStop(1, 'rgba(4,5,13,0)');
                        ctx.save();
                        ctx.translate(cx, cy);
                        ctx.rotate(l.ang);
                        ctx.fillStyle = lg;
                        ctx.beginPath();
                        ctx.ellipse(0, 0, l.len * c.width / 2, l.w * c.height, 0, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.restore();
                    });

                    shootTimer++;
                    if (shootTimer >= nextShoot) { spawnShoot(); shootTimer = 0; nextShoot = rand(55, 100); }
                    for (var i = shoots.length - 1; i >= 0; i--) {
                        var s = shoots[i];
                        var tx = s.x - s.vx * (s.len / 10), ty = s.y - s.vy * (s.len / 10);
                        var gr = ctx.createLinearGradient(tx, ty, s.x, s.y);
                        gr.addColorStop(0, 'rgba(255,255,255,0)');
                        gr.addColorStop(0.55, 'rgba(34,211,238,' + (s.life * 0.55) + ')');
                        gr.addColorStop(1, 'rgba(255,255,255,' + s.life + ')');
                        ctx.beginPath();
                        ctx.moveTo(tx, ty);
                        ctx.lineTo(s.x, s.y);
                        ctx.strokeStyle = gr;
                        ctx.lineWidth = s.w * s.life;
                        ctx.lineCap = 'round';
                        ctx.stroke();
                        ctx.beginPath();
                        ctx.arc(s.x, s.y, s.w * 2 * s.life, 0, Math.PI * 2);
                        ctx.fillStyle = 'rgba(255,255,255,' + (s.life * 0.85) + ')';
                        ctx.fill();
                        s.x += s.vx;
                        s.y += s.vy;
                        s.life -= s.decay;

                        if (s.life <= 0 || s.x > c.width + 80 || s.y > c.height + 80) shoots.splice(i, 1);
                    }
                    requestAnimationFrame(draw);
                }
                draw();
            })();


            /* ======== Create dot ====== */

            function createDot(src, onScreen, id) {
                var dotSize = Math.floor(rand(7, 14));
                var g = GLOWS[Math.floor(Math.random() * GLOWS.length)];

                var el = document.createElement('div');
                el.className = 'photo-dot';

                var img = document.createElement('img');
                img.src = src;
                img.alt = 'Memory';
                img.draggable = false;
                el.appendChild(img);

                var cap = document.createElement('div');
                cap.className = 'dot-cap';
                // cap.textContent = 'memory';
                el.appendChild(cap);

                var rmBtn = document.createElement('div');
                rmBtn.className = 'dot-remove';
                rmBtn.title = 'Remove photo';
                rmBtn.innerHTML = '&#10005;';
                el.appendChild(rmBtn);

                document.body.appendChild(el);

                var b = {
                    el: el, src: src, id: id,
                    x: rand(20, W - 20),
                    y: onScreen ? rand(HEADER_H + 10, H - 20) : rand(-H * 0.9, -10),
                    vx: rand(-0.32, 0.32),
                    vy: rand(0.6, 1.15),
                    dotSize: dotSize, glow: g,
                    expanded: false, pinned: false
                };

                var pulseDur = rand(1.6, 3.2).toFixed(2) + 's';
                el.style.cssText = 'width:' + dotSize + 'px;height:' + dotSize + 'px;' + '--dp:' + pulseDur + ';' + '--dc:' + g.c + ';' + 'left:' + b.x + 'px;top:' + b.y + 'px;' + 'box-shadow:' + g.s + ';';

                rmBtn.addEventListener('click', function (e) {
                    e.stopPropagation();
                    el.style.transition = 'opacity 0.3s, transform 0.3s';
                    el.style.opacity = '0';
                    el.style.transform = 'translate(-50%,-50%) scale(0.4)';
                    setTimeout(function () {
                        el.remove();
                        var idx = bubbles.indexOf(b);
                        if (idx !== -1) bubbles.splice(idx, 1);
                        updateCount();
                        showToast('Photo removed');
                    }, 320);

                    // Only Firestore-backed photos (real doc id) are actually
                    // deleted server-side - the 32 built-in seed photos aren't
                    // tied to a document, so removing one is session-only,
                    // same as it always was.
                    if (b.id) {
                        import('/JavaScript/data-memories.js')
                            .then(function (m) { return m.deleteMemoryDoc(b.id); })
                            .catch(function () { showToast('Failed to delete on the server - it may reappear on reload.'); });
                    }
                });

                el.addEventListener('click', function (e) {
                    e.stopPropagation();
                    if (b.pinned) {
                        b.pinned = false; el.classList.remove('pinned');
                    } else {
                        if (!b.expanded) expand(b);
                        b.pinned = true; el.classList.add('pinned');
                    }
                });

                bubbles.push(b);
                return b;
            }

            function expand(b) {
                if (b.expanded) return;
                b.expanded = true;
                b.el.style.width = EXPAND_W + 'px';
                b.el.style.height = EXPAND_H + 'px';
                b.el.style.boxShadow = '0 0 0 2px rgba(34,211,238,0.4),0 12px 48px rgba(0,0,0,0.85),0 0 55px rgba(34,211,238,0.18)';
                b.el.classList.add('expanded');
            }

            function collapse(b) {
                if (!b.expanded) return;
                b.expanded = false; b.pinned = false;
                b.el.style.width = b.dotSize + 'px';
                b.el.style.height = b.dotSize + 'px';
                b.el.style.boxShadow = b.glow.s;
                b.el.classList.remove('expanded', 'pinned');
            }

            /* Populate all photo - the 32 built-in ones are permanent site
               content, always shown. Admin-uploaded photos (Firestore) are
               added on top once the read resolves, not a replacement. */
            SRCS.forEach(function (src, i) { createDot(src, i % 2 === 0); });
            updateCount();

            import('/JavaScript/data-memories.js').then(function (m) {
                return m.getMemories();
            }).then(function (memories) {
                memories.forEach(function (mem) { createDot(mem.imageUrl, true, mem.id); });
                updateCount();
            }).catch(function () {
                // Offline or Firestore error - the built-in gallery still shows
            });

            /* ====== Physics Loop ====== */
            function loop() {
                bubbles.forEach(function (b) {
                    var dx = mx - b.x, dy = my - b.y;
                    var dist = Math.sqrt(dx * dx + dy * dy);

                    var exThresh = b.expanded ? EXPAND * 0.68 : 46;
                    var colThresh = exThresh + 38;

                    if (!b.pinned) {
                        if (dist < exThresh && !b.expanded) expand(b);
                        if (dist > colThresh && b.expanded) collapse(b);
                    }

                    if (!b.expanded) {
                        b.y += b.vy * speedMul;
                        b.x += b.vx * speedMul;
                        if (Math.random() < 0.004) {
                            b.vx += rand(-0.12, 0.12);
                            b.vx = Math.max(-0.65, Math.min(0.65, b.vx));
                        }
                        if (b.x < 10) { b.x = 10; b.vx = Math.abs(b.vx); }
                        if (b.x > W - 10) { b.x = W - 10; b.vx = -Math.abs(b.vx); }
                        if (b.y > H + 30) {
                            b.y = rand(-70, -8);
                            b.x = rand(18, W - 18);
                            b.vx = rand(-0.32, 0.32);
                        }
                    }

                    b.el.style.left = b.x + 'px';
                    b.el.style.top = b.y + 'px';
                });
                requestAnimationFrame(loop);
            }
            loop();

            /* click outside = unpin all */
            document.addEventListener('click', function (e) {
                if (!e.target.closest('.photo-dot')) {
                    bubbles.forEach(function (b) {
                        if (b.pinned) {
                            b.pinned = false;
                            b.el.classList.remove('pinned');
                        }
                    });
                }
            });

            /* Cursor / touch tracking */
            document.addEventListener('mousemove', function (e) { mx = e.clientX; my = e.clientY; });
            document.addEventListener('mouseleave', function () { mx = -9999; my = -9999; });
            document.addEventListener('touchmove', function (e) { mx = e.touches[0].clientX; my = e.touches[0].clientY; }, { passive: true });
            document.addEventListener('touchend', function (e) {
                var t = e.changedTouches[0]; mx = t.clientX; my = t.clientY;
                setTimeout(function () { mx = -9999; }, 1400);
            });

            /* Add Photo - uploads to Cloudinary, persists via Firestore */
            document.getElementById('photoInput').addEventListener('change', function (e) {
                var files = Array.from(e.target.files).filter(function (f) { return f.type.startsWith('image/'); });
                this.value = '';
                if (!files.length) return;

                import('/JavaScript/data-memories.js').then(function (m) {
                    var done = 0;
                    files.forEach(function (file) {
                        m.uploadMemoryImage(file).then(function (imageUrl) {
                            return m.addMemoryDoc(imageUrl).then(function (id) {
                                createDot(imageUrl, true, id);
                                updateCount();
                                done++;
                                if (done === files.length) showToast(done + ' photo' + (done > 1 ? 's' : '') + ' added');
                            });
                        }).catch(function () {
                            showToast('Upload failed - check you are signed in as admin.');
                        });
                    });
                });
            });

            function updateCount() {
                var el = document.getElementById('photoCount');
                if (el) el.textContent = bubbles.length + ' photo' + (bubbles.length !== 1 ? 's' : '');
            }

            /* Speed control dock */
            (function () {
                var slider = document.getElementById('speedSlider');
                var valueLabel = document.getElementById('speedValue');
                if (!slider) return;
                slider.addEventListener('input', function () {
                    var pct = parseInt(slider.value, 10); // 0-200
                    speedMul = pct / 100; // 0x - 2x
                    valueLabel.textContent = speedMul.toFixed(1) + '\u00d7';
                });
            })();

            function showToast(msg) {
                var t = document.getElementById('memToast');
                t.textContent = msg;
                t.classList.add('show');
                setTimeout(function () { t.classList.remove('show'); }, 3000);
            }
        })();
    </script>

</body>

</html>
